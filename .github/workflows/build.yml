name: Build and Sign iOS App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen fastlane
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Create keychain
        run: |
          security create-keychain -p actions fastlane_keychain
          security default-keychain -s fastlane_keychain
          security unlock-keychain -p actions fastlane_keychain
          security set-keychain-settings -t 3600 -u fastlane_keychain
      - name: Sign
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          UDID: ${{ secrets.UDID }}
        run: fastlane sign
      - name: Upload signed ipa
        uses: actions/upload-artifact@v4
        with:
          name: QKernel-signed
          path: fastlane/output/QKernel-signed.ipa
