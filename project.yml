name: QKernel
options:
  bundleIdPrefix: com.huu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  objectVersion: 56
  createIntermediateGroups: true
targets:
  QKernel:
    type: application
    platform: iOS
    sources:
      - path: QKernel/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huu.qkernel
        INFOPLIST_FILE: QKernel/App/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
